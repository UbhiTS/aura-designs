<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="auraGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="180" height="180" rx="40" fill="#1a1a2e"/>
  <!-- Outer glow ring -->
  <circle cx="90" cy="90" r="65" fill="none" stroke="url(#auraGradient)" stroke-width="4" opacity="0.6"/>
  <!-- Inner glow ring -->
  <circle cx="90" cy="90" r="45" fill="none" stroke="url(#auraGradient)" stroke-width="3" opacity="0.4"/>
  <!-- Star/sparkle accent -->
  <path d="M90 30 L95 80 L90 85 L85 80 Z" fill="url(#auraGradient)"/>
  <path d="M90 150 L95 100 L90 95 L85 100 Z" fill="url(#auraGradient)"/>
  <path d="M30 90 L80 85 L85 90 L80 95 Z" fill="url(#auraGradient)"/>
  <path d="M150 90 L100 85 L95 90 L100 95 Z" fill="url(#auraGradient)"/>
  <!-- Center dot -->
  <circle cx="90" cy="90" r="12" fill="url(#auraGradient)"/>
</svg>
